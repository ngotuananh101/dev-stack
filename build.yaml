targets:
  $default:
    builders:
      riverpod_generator:
        options:
          # Riverpod 3's generator strips a trailing "Notifier" from class
          # names before appending the "Provider" suffix, so `SettingsNotifier`
          # would generate `settingsProvider`. This codebase was written against
          # Riverpod 2's naming, where the class name was kept verbatim:
          # `SettingsNotifier` -> `settingsNotifierProvider`.
          #
          # An empty strip pattern restores the Riverpod 2 naming so the
          # generated provider identifiers keep matching the ~120 existing
          # call sites.
          provider_name_strip_pattern: ""
