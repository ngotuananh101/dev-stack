name: Update App Versions to Gist

on:
  schedule:
    - cron: '0 0 * * *' # Run every day at 00:00 UTC
  workflow_dispatch: # Allow manual triggering

jobs:
  update-gist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run update script
        run: node assets/data/update.js

      - name: Update Gist (Windows & Linux catalogs)
        env:
          GH_TOKEN: ${{ secrets.GIST_PAT }} # Cần Personal Access Token có quyền 'gist'
          GIST_ID: ${{ secrets.GIST_ID }}   # ID của Gist bạn đã tạo
        run: |
          if [ -n "$GIST_ID" ]; then
            echo "Gist ID detected. Updating apps.json and apps-linux.json..."
            # Use GitHub REST API to atomically update or add files to the multi-file gist
            gh api -X PATCH "gists/$GIST_ID" \
              -F "files[apps.json][content]=@assets/data/new-apps.json" \
              -F "files[apps-linux.json][content]=@assets/data/new-apps-linux.json"
            echo "Gist updated successfully."
          else
            echo "Error: GIST_ID is missing from Secrets."
            exit 1
          fi
