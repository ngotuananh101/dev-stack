name: Update App Versions to Gist

on:
  schedule:
    - cron: '0 0 * * *' # Run every day at 00:00 UTC
  workflow_dispatch: # Allow manual triggering

jobs:
  update-gist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run update script
        run: node assets/data/update.js

      - name: Update Gist
        env:
          GH_TOKEN: ${{ secrets.GIST_PAT }} # Cần Personal Access Token có quyền 'gist'
          GIST_ID: ${{ secrets.GIST_ID }}   # ID của Gist bạn đã tạo
        run: |
          if [ -n "$GIST_ID" ]; then
            echo "Gist ID detected. Attempting to update..."
            # Truyền trực tiếp đường dẫn file local vào tham số của lệnh gh
            gh gist edit "$GIST_ID" -f "apps.json" assets/data/new-apps.json
          else
            echo "Error: GIST_ID is missing from Secrets."
            exit 1
          fi
