name: Update App Versions to Gist

on:
  schedule:
    - cron: '0 0 * * *' # Run every day at 00:00 UTC
  workflow_dispatch: # Allow manual triggering

jobs:
  update-gist:
    runs-on: ubuntu-latest
    # Release scans read public repository metadata only; the Gist write
    # uses GIST_PAT, so no broader repository scope is needed.
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Run update script
        env:
          # Raises the rate limit for release metadata requests to api.github.com.
          GITHUB_TOKEN: ${{ github.token }}
        run: node assets/data/update.js

      - name: Update Gist (Windows & Linux catalogs)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GIST_PAT }} # Personal access token with Gist permissions
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          if [ -n "$GIST_ID" ]; then
            echo "Updating Windows, legacy Linux, and versioned Linux catalogs..."
            # Publish all three files together and keep Compass out of the legacy Linux feed.
            node assets/data/gist-catalog-payload.cjs assets/data/new-apps.json assets/data/new-apps-linux.json \
              | gh api -X PATCH "gists/$GIST_ID" --input -
            echo "Gist updated successfully."
          else
            echo "Error: GIST_ID is missing from Secrets."
            exit 1
          fi
