name: Build Assets (Windows & Linux)

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Build Windows Asset (.zip)'
        type: boolean
        default: true
        required: true
      build_linux:
        description: 'Build Linux Asset (.AppImage, .tar.gz & .zip)'
        type: boolean
        default: true
        required: true
      create_release:
        description: 'Create GitHub Release with built assets'
        type: boolean
        default: false
        required: false
      release_tag:
        description: 'Release tag (e.g. v1.0.0, required if Create Release is true)'
        type: string
        default: ''
        required: false

jobs:
  build-windows:
    name: Build Windows (.zip)
    if: ${{ github.event.inputs.build_windows == 'true' || github.event.inputs.build_windows == true }}
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.18.0
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run code generation (if needed)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Windows Bundle (.zip)
        shell: pwsh
        run: |
          $buildDir = "build/windows/x64/runner/Release"
          $outputDir = "dist"
          New-Item -ItemType Directory -Force -Path $outputDir
          $zipPath = "$outputDir/dev-stack-windows-x64.zip"
          Compress-Archive -Path "$buildDir/*" -DestinationPath $zipPath -Force
          Write-Host "Created Windows artifact: $zipPath"

      - name: Upload Windows (.zip)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dev-stack-windows-x64-zip
          path: dist/dev-stack-windows-x64.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux (.AppImage, .tar.gz & .zip)
    if: ${{ github.event.inputs.build_linux == 'true' || github.event.inputs.build_linux == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libayatana-appindicator3-dev \
            curl \
            file \
            zip

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.18.0
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run code generation (if needed)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Package Linux Bundle (.tar.gz, .zip & .AppImage)
        run: |
          mkdir -p dist
          BUNDLE_DIR="build/linux/x64/release/bundle"

          # 1. Create full tar.gz preserving Linux executable permissions
          tar -czf dist/dev-stack-linux-x64.tar.gz -C "$BUNDLE_DIR" .

          # 2. Create zip bundle for portability
          (cd "$BUNDLE_DIR" && zip -r - .) > dist/dev-stack-linux-x64.zip

          # 3. Create AppImage
          mkdir -p AppDir
          cp -r "$BUNDLE_DIR"/* AppDir/
          cp assets/images/icon.png AppDir/dev_stack.png
          cp assets/images/icon.png AppDir/.DirIcon

          cat << 'EOF' > AppDir/dev_stack.desktop
          [Desktop Entry]
          Name=Ponta DevStack
          Comment=Local development stack for Web & Databases
          Exec=dev_stack %u
          Icon=dev_stack
          Terminal=false
          Type=Application
          Categories=Development;
          EOF

          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/dev_stack" "$@"
          EOF
          chmod +x AppDir/AppRun

          # Download and run appimagetool
          curl --proto "=https" --tlsv1.2 -sSf -L -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run --no-appstream AppDir dist/dev-stack-linux-x64.AppImage

          ls -lh dist/

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dev-stack-linux-x64-appimage
          path: dist/dev-stack-linux-x64.AppImage
          if-no-files-found: error

      - name: Upload Linux tar.gz
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dev-stack-linux-x64-tar
          path: dist/dev-stack-linux-x64.tar.gz
          if-no-files-found: error

      - name: Upload Linux zip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dev-stack-linux-x64-zip
          path: dist/dev-stack-linux-x64.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    if: ${{ always() && (github.event.inputs.create_release == 'true' || github.event.inputs.create_release == true) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download all built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          merge-multiple: true

      - name: List Release Assets
        run: ls -la release-assets/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          TAG="${RELEASE_TAG:-v$(date +'%Y.%m.%d-%H%M')}"
          echo "Publishing release with tag: $TAG"
          gh release create "$TAG" \
            release-assets/* \
            --title "DevStack $TAG" \
            --notes "Automated release build for Windows (.zip) and Linux (.AppImage, .tar.gz, .zip)." \
            --draft=false \
            --prerelease=false
